# Builds the Flutter app for iOS on a GitHub-hosted Mac (iOS can't be built on Windows).
# Output: an UNSIGNED .ipa, downloadable from the run's "Artifacts" section.
# Install it on an iPhone with Sideloadly or AltStore (they sign it with your Apple ID),
# or sign it in Xcode for TestFlight / the App Store.
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr mafqoodak-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: mafqoodak-ios
          path: mobile_app/mafqoodak-unsigned.ipa
